<!doctype html>
<html lang="ca">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Bis Copisteria · Prototips</title>
<style>
:root { --navy:#121A3A; --red:#C40E18; --ink:#0B0B0C; --soft:#F3F3F1; }
* { box-sizing: border-box; }
body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--soft); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; padding:24px; }
main { width:100%; max-width:720px; }
h1 { font-size:clamp(1.8rem,5vw,2.6rem); margin:0 0 8px; letter-spacing:-.02em; }
p { margin:0 0 28px; color:#555; }
.grid { display:grid; grid-template-columns:1fr 1fr; gap:16px; }
a { display:block; padding:28px; border-radius:16px; text-decoration:none; color:#fff; }
a b { display:block; font-size:1.4rem; margin-bottom:6px; }
.a { background:var(--ink); } .b { background:var(--navy); box-shadow: inset 0 -6px 0 var(--red); }
@media (max-width:560px){ .grid{ grid-template-columns:1fr; } }
</style>
</head>
<body>
<main>
<h1>Bis Copisteria · Prototips</h1>
<p>Proposta de web per a Bis Copisteria (Lliçà d'Amunt) · She is Digital Lab</p>
<div class="grid">
<a class="a" href="version-a/"><b>Versió A</b>Galeria clara amb fotos</a>
<a class="b" href="version-b/"><b>Versió B</b>Marca en color</a>
</div>
</main>
</body>
</html>
